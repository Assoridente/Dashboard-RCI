  MARKDOWN-3h12f4pQ0gLvPlZ9z4Yvd:
    children: []
    id: MARKDOWN-3h12f4pQ0gLvPlZ9z4Yvd
    meta:
      code: "### Publica\xE7\xE3o mensal\n\nO painel mostra somente meses encerrados\
        \ e fechados ap\xF3s a importa\xE7\xE3o do relat\xF3rio final.\n\n**Use o\
        \ filtro Compet\xEAncia (m\xEAs/ano)** para consultar um m\xEAs. Os cart\xF5\
        es exibem os \xEDndices da compet\xEAncia escolhida.\n\nO m\xEAs corrente\
        \ n\xE3o \xE9 publicado. A data de fechamento aparece na tabela de resultado\
        \ mensal.\n\n**Fluxo:** importar o relat\xF3rio final \u2192 atualizar os\
        \ dados \u2192 conferir \u2192 fechar a compet\xEAncia.\n\nCorre\xE7\xF5es\
        \ de meses publicados geram uma nova vers\xE3o de fechamento."
      height: 37
      width: 6
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-dL4SKBrxF0Rnolq6k0mLM
    type: MARKDOWN
  MARKDOWN-ULYS2lOCQBSC9RSNnRni_:
    children: []
    id: MARKDOWN-ULYS2lOCQBSC9RSNnRni_
    meta:
      code: "### Indicadores mensais do RCI\n\n| Indicador | Peso | Regra |\n| :---\
        \ | :--- | :--- |\n| **IES \u2014 Entregas** | 40% | Itens marcados como n\xE3\
        o entregues \xF7 itens planejados no m\xEAs. |\n| **IAP \u2014 Aus\xEAncias**\
        \ | 30% | Dias de aus\xEAncia \xF7 (postos de trabalho \xD7 dias \xFAteis\
        \ do m\xEAs). |\n| **IFB \u2014 Falhas** | 30% | Itens com falha \xF7 itens\
        \ planejados no m\xEAs. |\n\n**RCI = 1 \u2212 (IES + IAP + IFB)** \xB7 Meta:\
        \ **0,95**.\n\nOs itens pertencem ao m\xEAs do t\xE9rmino previsto das sprints\
        \ fechadas. Os \xEDndices s\xE3o calculados pelos totais mensais.\n\nDias\
        \ \xFAteis excluem s\xE1bados, domingos e feriados cadastrados do Rio de Janeiro.\
        \ O RCI \xE9 exibido com duas casas decimais."
      height: 50
      width: 6
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-i36RyVccyHWPxkJnQlMmp
    type: MARKDOWN
